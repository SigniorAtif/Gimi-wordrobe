name: Release

# Push a version tag (git tag v0.2.0 && git push origin v0.2.0) to build the Windows installer and publish it on the
# repo's Releases page. The tag must match the version in tauri.conf.json, so the installer's name and the release agree.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match tauri.conf.json version $version. Bump the version (tauri.conf.json, package.json, Cargo.toml) or fix the tag."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx vitest run
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # beforeBuildCommand runs `npm run build`, whose prebuild fetches and builds the hash index
      - run: npm run tauri build

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName
          if (-not $installers) { Write-Error "No installer was built."; exit 1 }
          gh release create "${{ github.ref_name }}" $installers --title "Skin Switcher ${{ github.ref_name }}" --generate-notes --verify-tag
