name: Release

# Merging a version bump into main publishes the Windows installer on the repo's Releases page. Bump the version in
# tauri.conf.json, package.json and Cargo.toml in a PR; on merge this builds, tags v<version> and releases it. Merges
# that don't change the version find the tag already there and stop after one quick step.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a new version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          $new = $LASTEXITCODE -ne 0
          if (-not $new) { Write-Host "$tag is already released; nothing to do." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "new=$($new.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          exit 0

      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.version.outputs.new == 'true'
        uses: dtolnay/rust-toolchain@stable

      - if: steps.version.outputs.new == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - if: steps.version.outputs.new == 'true'
        run: npm ci

      - if: steps.version.outputs.new == 'true'
        run: npx vitest run

      - if: steps.version.outputs.new == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # beforeBuildCommand runs `npm run build`, whose prebuild fetches and builds the hash index
      - if: steps.version.outputs.new == 'true'
        run: npm run tauri build

      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $installers = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName
          if (-not $installers) { Write-Error "No installer was built."; exit 1 }
          gh release create $env:TAG $installers --target $env:GITHUB_SHA --title "Skin Switcher $env:TAG" --generate-notes
