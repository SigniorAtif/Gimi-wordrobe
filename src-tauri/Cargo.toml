[package]
name = "skin-switcher"
version = "0.2.1"
description = "Choose which mod skin each Genshin character wears (XXMI / 3DMigoto)"
authors = ["Atif Ahmed"]
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "skin_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
trash = "5"
ureq = { version = "3", features = ["json"] }
# NSFW PIN lock (SPEC §6): Argon2id hash with a random salt; password-hash only adds OS randomness for the salt
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"

# Keep debug builds small: the dev box is short on disk and nobody steps through dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Argon2 is unbearably slow unoptimised (a PIN check would take seconds in dev builds and tests)
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
